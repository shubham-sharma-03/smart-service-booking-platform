spring:
  application:
    name: smart-service-booking

  datasource:
    url: jdbc:postgresql://localhost:5432/service_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update     # update for development
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    cache: false
    prefix: classpath:/static/
    suffix: .html
    check-template-location: false

  web:
    resources:
      static-locations: classpath:/static/

  mail:
